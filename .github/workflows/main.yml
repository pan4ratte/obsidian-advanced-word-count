name: Build, Attest, and Release

# Releases are driven by the version in manifest.json: bump it and push to main,
# and this workflow tags that commit and publishes the release. Pushes that touch
# manifest.json without changing the version are ignored (the release already
# exists), so editing e.g. minAppVersion is safe.
on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
  workflow_dispatch:

jobs:
  # Read the manifest version and decide whether it still needs releasing.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if a release for this version already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $VERSION not found — will build and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write      # Required for attestation signing
      contents: write      # Required to create the tag and GitHub Release
      attestations: write  # Required to write the attestation

    env:
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Set up the Node.js environment on the GitHub server
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'       # Automatically caches dependencies to make future builds faster

      # Step 2: Install plugin's dependencies
      - name: Install dependencies
        run: npm ci

      # Step 3: Run npm build command
      - name: Build plugin
        run: npm run build

      # Step 4: Attest the files generated by build script
      - name: Attest plugin files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Step 5: Extract release notes from CHANGELOG.md for this version
      - name: Extract release notes
        id: changelog
        run: |
          NOTES=$(awk "/^## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Step 6: Tag this commit and create the GitHub Release with the attested files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            main.js
            manifest.json
            styles.css
